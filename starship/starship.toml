"$schema" = 'https://starship.rs/config-schema.json'

# パンくずリスト風のフラットデザイン（Tokyo Nightのアクセントカラーを使用、
# ghosttyのテーマと統一）。
# "~/path > branch!? > go1.24.1 22:18❯" のように、区切りは ">"。
# パンくず用の ">" は「その区切りの左側にある情報がある時だけ」表示されるよう、
# 各モジュール自身のformatに埋め込んである（値が空のモジュールはformat内の
# 静的テキストごと非表示になるため）。gitリポジトリでない時はgit系が丸ごと消え、
# gitリポジトリの時だけ ${custom.git_arrow} で2つ目の ">" が出る。

format = """
$os\
$directory\
$git_branch\
$git_status\
${custom.git_arrow}\
$python\
$nodejs\
$bun\
$rust\
$golang\
$php\
$time\
$character"""

[os]
style = "bold #7dcfff"
format = "[$symbol ]($style)"
disabled = false

[os.symbols]
Macos = "󰀵"

[directory]
style = "bold #7aa2f7"
format = "[$path]($style)[ >](bold #565f89) "
# 0 = 切り詰めない。~ 起点でフルパス表示する。
truncation_length = 0
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bold #bb9af7"
format = "[$symbol$branch]($style)"

[git_status]
style = "bold #f7768e"
format = "[$all_status$ahead_behind]($style)"

# git_branch/git_statusだけだと、リポジトリが完全にcleanな時に2つ目の">"を
# 出す場所がない（git_statusの中身が空になるため）。git repoにいる間だけ有効な
# custom moduleとして">"を独立させることで、clean/dirty問わず出るようにしている。
[custom.git_arrow]
command = "echo ok"
when = "git rev-parse --is-inside-work-tree"
format = "[ >](bold #565f89) "

[python]
symbol = ""
style = "bold #9ece6a"
format = "[$symbol($version) ]($style)"

[nodejs]
symbol = ""
style = "bold #9ece6a"
format = "[$symbol($version) ]($style)"

[bun]
symbol = ""
style = "bold #9ece6a"
format = "[$symbol($version) ]($style)"

[rust]
symbol = ""
style = "bold #ff9e64"
format = "[$symbol($version) ]($style)"

[golang]
symbol = ""
style = "bold #7dcfff"
format = "[$symbol($version) ]($style)"

[php]
symbol = ""
style = "bold #bb9af7"
format = "[$symbol($version) ]($style)"

[time]
disabled = false
time_format = "%R"
style = "bold #565f89"
format = "[$time]($style)"

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
