onboarding = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true

[theme]
name = "catppuccin"
auto_switch = false

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "dave.token-dashboard.open-dashboard"
description = "open token dashboard"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects (alias of prefix+up)"

# switch tab (prefix+1..9) のshift版。ワークスペースをインデックスで切り替える。
[keys]
switch_workspace = "prefix+shift+1..9"
